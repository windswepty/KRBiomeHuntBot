# Oracle 인스턴스가 정지되면 자동으로 다시 켭니다.
#
# 왜 필요한가
#   Always Free 계정은 7일간 CPU·네트워크 사용률이 낮으면 '유휴'로 판정되어
#   인스턴스가 **정지**됩니다(삭제 아님). 디스코드 봇은 대부분 대기 상태라
#   잘 돌고 있어도 이 기준에 걸립니다. 정지된 인스턴스를 다시 켜는 것은
#   Oracle 이 명시적으로 허용한 동작입니다.
#
#   운영자가 오래 자리를 비우는 것이 이 봇의 설계 전제라, "이메일을 보고
#   사람이 켠다"에 기댈 수 없습니다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions)
#   OCI_CLI_USER          ocid1.user.oc1..~
#   OCI_CLI_TENANCY       ocid1.tenancy.oc1..~
#   OCI_CLI_FINGERPRINT   xx:xx:...:xx
#   OCI_CLI_KEY_CONTENT   개인키 PEM 전문 (-----BEGIN 부터 END----- 까지)
#   OCI_CLI_REGION        ap-tokyo-1
#   OCI_INSTANCE_ID       ocid1.instance.oc1.ap-tokyo-1.~
#   BOT_HEALTH_URL        (선택) http://<IP>:8080/health
#
# 알림은 이 워크플로가 아니라 UptimeRobot 이 담당합니다.
# 여기서 실패(=이메일)는 **스스로 고칠 수 없는 경우**에만 냅니다.
# 늘 빨간 표시는 없는 것보다 나쁩니다 — 익숙해져서 진짜 경고를 놓칩니다.

name: 인스턴스 자동 재시작

on:
  schedule:
    # 3시간마다. 분을 17로 흩어 정각 혼잡을 피합니다.
    # 월 약 240회 × 1.5분 = 360분 (비공개 저장소 무료 2,000분 중 18%)
    - cron: "17 */3 * * *"
  workflow_dispatch:
    # 폰에서 GitHub 앱으로 눌러 쓰라고 만든 입구입니다.
    # 오라클 콘솔은 모바일에서 다루기 번거로운데, 여기는 버튼 두 번이면 됩니다.
    inputs:
      force:
        description: "check=상태만 확인 / reboot=강제 재부팅 (봇 약 2분 중단)"
        type: choice
        required: true
        default: check
        options: [check, reboot]
      target:
        description: "재부팅할 인스턴스 이름"
        type: string
        required: false
        default: krbiomehuntbot

permissions:
  contents: write           # 60일 비활성 방지용 빈 커밋

concurrency:
  group: oci-keepalive
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: OCI CLI 설치
        run: |
          pip install --quiet --disable-pip-version-check oci-cli
          oci --version

      - name: 인증 준비
        # 환경변수만으로도 되지만, CI 에서 ~/.oci/config 가 없어 실패하는
        # 사례가 흔합니다. 설정 파일을 명시적으로 만들어 경로를 하나로 굳힙니다.
        # 개인키는 600 이어야 CLI 가 받아 줍니다.
        env:
          U: ${{ secrets.OCI_CLI_USER }}
          T: ${{ secrets.OCI_CLI_TENANCY }}
          F: ${{ secrets.OCI_CLI_FINGERPRINT }}
          K: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          R: ${{ secrets.OCI_CLI_REGION }}
          # OCI CLI 는 키 파일 끝에 OCI_API_KEY 라벨이 없으면 매번 경고를
          # 냅니다. CI 의 일회용 파일이라 해당 없는 권고인데, 늘 노란불이
          # 뜨면 진짜 경고를 놓치게 되므로 끕니다.
          SUPPRESS_LABEL_WARNING: 'True'
        run: |
          set -euo pipefail
          for v in U T F K R; do
            if [ -z "${!v:-}" ]; then
              echo "::error::시크릿이 비어 있습니다 — .github/KEEPALIVE-SETUP.md 를 보세요 ($v)"
              exit 1
            fi
          done
          mkdir -p ~/.oci
          # 메모장에서 복사하면 CR 이 딸려옵니다. 짧은 값은 공백까지 털어냅니다.
          U=$(printf %s "$U" | tr -d "[:space:]")
          T=$(printf %s "$T" | tr -d "[:space:]")
          F=$(printf %s "$F" | tr -d "[:space:]")
          R=$(printf %s "$R" | tr -d "[:space:]")
          # 개인키는 줄바꿈이 필요하므로 CR 만 제거합니다
          printf %s "$K" | tr -d "\r" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          # 값은 절대 찍지 않고 형태만 봅니다. 여기서 잡아 주지 않으면
          # OCI CLI 가 "not a private key" 한 줄만 남기고 끝납니다.
          head1=$(head -1 ~/.oci/key.pem)
          case "$head1" in
            *"BEGIN"*"PRIVATE KEY"*) : ;;
            *"BEGIN"*"PUBLIC KEY"*)
              echo "::error::공개키를 넣으셨습니다. Oracle 에서 받은 **개인 키**(private) .pem 이 필요합니다."
              exit 1 ;;
            *)
              echo "::error::개인키 형식이 아닙니다. 첫 줄이 -----BEGIN PRIVATE KEY----- 여야 합니다."
              echo "지금 첫 줄의 길이: ${#head1} 자"
              exit 1 ;;
          esac
          if ! tail -3 ~/.oci/key.pem | grep -q "END"; then
              echo "::error::마지막 -----END ...----- 줄이 없습니다. 전문을 붙여넣어 주세요."
              exit 1
          fi
          echo "개인키 확인 OK ($(wc -l < ~/.oci/key.pem) 줄)"
          echo "지문 ${#F} 자 · 사용자 OCID ${#U} 자 · 테넌시 OCID ${#T} 자"
          # 값 자체는 로그에 남기지 않습니다 (GitHub 이 가려 주지만 이중으로)
          {
            echo "[DEFAULT]"
            echo "user=$U"
            echo "tenancy=$T"
            echo "fingerprint=$F"
            echo "region=$R"
            echo "key_file=$HOME/.oci/key.pem"
          } > ~/.oci/config
          chmod 600 ~/.oci/config
          oci setup repair-file-permissions --file ~/.oci/config || true
          echo "설정 완료"

      - name: 인스턴스 전부 확인 · 꺼져 있으면 켜기
        env:
          TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          FORCE: ${{ inputs.force }}
          TARGET: ${{ inputs.target }}
          # 이름을 쉼표로 나열하면 그 인스턴스는 건드리지 않습니다.
          # (일부러 꺼 둔 것을 워크플로가 다시 켜지 않게 하는 탈출구)
          SKIP: ${{ vars.KEEPALIVE_SKIP }}
        run: |
          set -euo pipefail
          TENANCY=$(printf %s "$TENANCY" | tr -d "[:space:]")

          # OCID 를 박아 두지 않고 구획에서 찾아옵니다. 인스턴스를 새로
          # 만들거나 다시 만들어도 설정을 고칠 필요가 없습니다.
          if ! oci compute instance list --compartment-id "$TENANCY" --all \
                 --query 'data[].{id:id,name:"display-name",state:"lifecycle-state"}' \
                 --output json > /tmp/inst.json 2>/tmp/oci_err; then
            echo "::error::OCI 호출 실패 — 아래 메시지를 확인하세요"
            head -30 /tmp/oci_err
            exit 1
          fi

          count=$(jq length /tmp/inst.json)
          echo "인스턴스 ${count}개를 찾았습니다"
          if [ "$count" = "0" ]; then
            echo "::error::하나도 못 찾았습니다. 하위 구획에 있는지 확인하세요."
            exit 1
          fi

          # 파이프가 아니라 리다이렉션으로 읽습니다. 파이프면 서브셸이라
          # 아래에서 세는 fail/restarted 가 루프 밖에서 사라집니다.
          jq -r '.[] | [.id, .name, .state] | join("|")' /tmp/inst.json > /tmp/inst.txt
          fail=0
          restarted=""
          while IFS="|" read -r id name state; do
            case ",$SKIP," in
              *",$name,"*) echo "  $name : 건너뜀 (KEEPALIVE_SKIP)"; continue ;;
            esac
            # 폰에서 '재부팅'을 골라 실행한 경우. 켜져 있어도 강제로 다시 띄웁니다.
            # 봇이 살아는 있는데 이상할 때(응답 없음 등) 쓰는 탈출구입니다.
            if [ "${FORCE:-check}" = "reboot" ] && [ "$name" = "${TARGET:-krbiomehuntbot}" ]; then
              if [ "$state" = "RUNNING" ]; then
                echo "::warning::$name 강제 재부팅 (수동 요청)"
                act=SOFTRESET
              else
                echo "::warning::$name 이 $state 상태 — 켭니다 (수동 요청)"
                act=START
              fi
              if oci compute instance action --instance-id "$id" --action "$act"                    --wait-for-state RUNNING --max-wait-seconds 900 > /dev/null 2>/tmp/f_err; then
                echo "  $name : $act 완료 — 봇은 부팅과 함께 자동으로 뜹니다"
                restarted="$restarted $name"
              else
                echo "::error::$name $act 실패"
                head -20 /tmp/f_err
                fail=1
              fi
              continue
            fi

            case "$state" in
              RUNNING)
                echo "  $name : RUNNING — 할 일 없음" ;;
              STOPPED)
                echo "::warning::$name 이 정지되어 있습니다. 재시작합니다."
                if oci compute instance action --instance-id "$id" \
                     --action START --wait-for-state RUNNING \
                     --max-wait-seconds 600 > /dev/null 2>/tmp/start_err; then
                  echo "  $name : 재시작 완료 (봇은 systemd 가 부팅 시 띄웁니다)"
                  restarted="$restarted $name"
                else
                  echo "::error::$name 재시작 실패"
                  head -20 /tmp/start_err
                  fail=1
                fi ;;
              STARTING|STOPPING)
                # 전환 중에 끼어들면 오히려 꼬입니다. 다음 주기에 봅니다.
                echo "  $name : $state — 전환 중, 다음 주기에 확인" ;;
              TERMINATED|TERMINATING)
                # 삭제는 되살릴 수 없으니 경고만 냅니다. 실패로 잡으면
                # 일부러 지운 인스턴스 하나 때문에 워크플로가 영원히
                # 빨간불이 되고, 그러면 진짜 실패를 놓칩니다.
                # 봇 인스턴스가 삭제된 경우는 UptimeRobot 이 즉시 잡습니다.
                echo "::warning::$name 이 삭제된 상태입니다 — 자동 복구 대상 아님" ;;
              *)
                echo "::error::$name : 예상치 못한 상태 ($state)"
                fail=1 ;;
            esac
          done < /tmp/inst.txt

          if [ -n "$restarted" ]; then
            echo "RESTARTED=1" >> "$GITHUB_ENV"
            echo "재시작한 인스턴스:$restarted"
          fi
          exit $fail

      - name: 봇 응답 확인
        if: ${{ env.RESTARTED == '1' }}
        env:
          URL: ${{ secrets.BOT_HEALTH_URL }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ]; then
            echo "BOT_HEALTH_URL 미설정 — 건너뜁니다"
            exit 0
          fi
          # 부팅 + 디스코드 로그인까지 시간이 걸립니다. /health 는 기동 유예
          # 180초 안에서는 200 을 주므로, 넉넉히 기다렸다가 봅니다.
          for i in $(seq 1 10); do
            sleep 30
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$URL" || echo 000)
            echo "  시도 $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "봇 응답 정상"
              exit 0
            fi
          done
          echo "::error::인스턴스는 켰지만 봇이 5분 안에 응답하지 않습니다."
          exit 1

      - name: 60일 비활성 방지
        # GitHub 은 커밋이 60일간 없으면 예약 워크플로를 **자동으로 끕니다.**
        # 꺼진 뒤에는 스스로 되살릴 수 없습니다(실행이 안 되니까).
        # 태그·이슈·PR 은 타이머를 되돌리지 않습니다 — 오직 커밋뿐입니다.
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "마지막 커밋: ${age}일 전"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty \
              -m "chore: 예약 워크플로 유지용 빈 커밋 (60일 비활성 방지)"
            git push
            echo "빈 커밋을 남겼습니다 — 타이머 초기화"
          fi
